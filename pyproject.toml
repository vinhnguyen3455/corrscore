[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corrscore"
version = "0.1.0.dev0"
description = "Matrix-aware proper-scoring-rule backtesting for correlation and covariance forecasts: zero-overlap walk-forward evaluation, energy/variogram scoring, and significance testing (block bootstrap, Diebold-Mariano, Model Confidence Set)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "arch>=6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corrscore"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
