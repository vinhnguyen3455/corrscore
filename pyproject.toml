[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corrscore"
version = "0.1.0"
description = "Matrix-aware proper-scoring-rule backtesting for correlation and covariance forecasts: zero-overlap walk-forward evaluation, energy/variogram scoring, and significance testing (block bootstrap, Diebold-Mariano, Model Confidence Set)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vinh Nguyen", email = "vinhnguyen3455@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "arch>=6.3",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corrscore"]

[tool.mypy]
warn_unused_configs = true
ignore_missing_imports = true
